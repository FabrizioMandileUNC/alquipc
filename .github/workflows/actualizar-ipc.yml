# Baja el IPC todos los días y, si el INDEC publicó un dato nuevo, actualiza
# web/data/ipc.json y lo sube. El INDEC publica a las 16 h; esto corre a las 18:30 (Argentina).
name: Actualizar IPC

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-ipc
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Bajar el IPC
        env:
          INDEC_TOKEN: ${{ secrets.INDEC_TOKEN }}
        run: python -m scripts.actualizar_datos

      - name: Subir los datos nuevos
        run: |
          if git diff --quiet -- web/data/ipc.json; then
            echo "Sin cambios."
            exit 0
          fi
          ultimo=$(python -c "import json; print(max(json.load(open('web/data/ipc.json'))['serie']))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/ipc.json
          git commit -m "[chore] update ipc data to ${ultimo}"
          git push
